<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amt 61 – Quiz-Admin</title>
<link rel="stylesheet" href="pic.css">
<style>
:root{--bg:#10241c;--card:#1b3a2d;--in:#0c1b15;--red:#c8102e;--gold:#f5c542;--ink:#fff8e7;--mut:#a9c2b4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px "Trebuchet MS",Verdana,sans-serif}
header{padding:14px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--card)}
h1{margin:0;font-size:24px;color:var(--gold)}
main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;padding:16px;align-items:start}
@media(max-width:800px){main{grid-template-columns:1fr}}
.pane{background:var(--card);border-radius:14px;padding:14px}
button{font:inherit;padding:6px 12px;border-radius:8px;border:2px solid var(--gold);background:transparent;color:var(--ink);cursor:pointer}
button.p{background:var(--red);border-color:var(--red)}
button.s{padding:1px 7px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:7px 9px;border-radius:8px;border:2px solid #345a49;background:var(--in);color:var(--ink)}
textarea{min-height:76px;font-family:monospace;font-size:14px}
label{display:block;margin:10px 0 3px;color:var(--mut);font-size:13px}
.cat{margin-bottom:12px}
.cat h3{margin:0 0 4px;font-size:16px;color:var(--gold)}
.it{display:flex;gap:4px;align-items:center;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:14px}
.it span.t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it:hover{background:#25483a}.it.on{background:#2f5a49}
.rank{margin:6px 0;padding:3px 8px;border-radius:7px;background:#12291f;color:var(--gold);font-size:12px;text-align:center}
.todo{color:#ff5a6e}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;background:#12291f;color:var(--mut)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:8px;align-items:center;margin-top:6px}.opt input[type=radio],.opt input[type=checkbox]{width:auto}.opt input[type=checkbox]{transform:scale(1.3)}
canvas{max-width:100%;border-radius:10px;background:#000}
.drop{display:flex;gap:14px;align-items:center;border:2px dashed #4f7d68;border-radius:12px;padding:10px;margin-top:4px;transition:background .2s}
.drop.on{background:#2f5a49;border-color:var(--gold)}
.drop>img,.drop .ph{width:120px;height:80px;object-fit:cover;border-radius:8px;background:#000;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:34px}
.drop>div{flex:1;min-width:0}.drop select{margin-top:6px}
.rng{display:flex;gap:10px;align-items:center}.rng input{flex:1;padding:0}.rng b{min-width:70px;text-align:right;color:var(--gold)}
.stage{width:100%;max-width:640px;aspect-ratio:16/9;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.stage canvas{border-radius:0}
#foc{cursor:crosshair;touch-action:none}
.pvbar{display:flex;gap:8px;align-items:center;margin-top:6px;max-width:640px}.pvbar input{flex:1;padding:0}
.note{color:var(--mut);font-size:13px;margin:4px 0}
#res{font-weight:bold;margin-top:6px}
.steps span{display:inline-block;font-size:30px;margin:2px 6px}
</style>
</head>
<body>
<header>
<h1>🎄 Amt 61 – Quiz-Admin</h1>
<span class="note">Änderungen werden automatisch in Supabase gespeichert (und als Sicherung im Browser).</span> <b id="sbs" style="font-size:13px"></b>
<button id="sbtn" class="p">☁ Jetzt speichern</button> <button id="jbtn">JSON ein-/ausblenden</button>
</header>
<main>
<div class="pane" id="tree"></div>
<div>
<div class="pane" id="ed"></div>
<div class="pane" id="js" style="margin-top:16px;display:none">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button id="jgen" class="p">JSON erzeugen</button><button id="jload">JSON laden</button><button id="jreset">Auf Standard zurücksetzen</button></div>
<textarea id="jt" style="min-height:240px;margin-top:8px"></textarea>
</div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
var mc=function(t,o,c){return{type:'mc',text:t,options:o,correct:c,timeLimit:20}};
var es=function(t,a,u){return{type:'estimate',text:t,answer:a,unit:u,timeLimit:25}};
var tx=function(t,a,r,x){return Object.assign({type:'text',text:t,answers:a,reveal:r||'none',steps:[],timeLimit:15},x||{})};
var song=function(n){return tx('Lieder-Spezialfrage: Welches Lied ist das? ('+n+')',[],'audio')};
function std(){return{title:'Amt 61 – Das Weihnachtsquiz',categories:[
{name:'Traditionen',icon:'🎅',intro:'Wie feiert die Welt Weihnachten?',questions:[
mc('In welchem Land entstand der Brauch, einen geschmückten Weihnachtsbaum aufzustellen?',['Frankreich','Deutschland','Schweden','Norwegen'],1),
mc('In welchem Land bringt traditionell die Hexe Befana am 6. Januar den Kindern Geschenke?',['Spanien','Griechenland','Italien','Portugal'],2),
mc('In welchem Land ist es eine beliebte Weihnachtstradition, an Heiligabend bei KFC zu essen?',['Südkorea','Japan','USA','Mexico'],1),
mc('Was stellen Kinder in den Niederlanden traditionell am Abend vor dem Nikolaustag für Sinterklaas bereit?',['Einen Teller mit Keksen vor die Haustür','Einen Schuh mit einer Karotte für sein Pferd','Eine Kerze im Fenster','Eine Laterne am Dach'],1),
mc('In welchem Land gehört es zur Weihnachtstradition, eine Yule Cat (Weihnachtskatze) zu fürchten?',['Norwegen','Island','Finnland','Dänemark'],1)],
specials:[song('Lied 1 von 3'),song('Lied 2 von 3'),song('Lied 3 von 3')]},
{name:'Essen und Trinken',icon:'🍪',intro:'Von Glögg bis Marzipan.',questions:[
mc('Wie nennt man den Glühwein in Schweden?',['Fika','Glögg','Julvin','Punsch'],1),
mc('Was versteckt sich traditionell im britischen Christmas Pudding, um dem Finder Glück zu bringen?',['Eine Mandel','Eine Silbermünze','Ein Zimtstern','Eine Walnuss'],1),
mc('In welchem Land hat der Baumkuchen, der besonders zur Weihnachtszeit beliebt ist, seinen Ursprung?',['Österreich','Deutschland','Frankreich','Schweden'],1),
mc('Was für eine Pizza bestellt sich Kevin in „Kevin – Allein zu Haus“?',['Pizza Salami','Pizza mit Käse und Peperoni','Pizza mit Käse','Pizza mit Schinken'],2),
mc('Woraus besteht Marzipan hauptsächlich?',['Haselnüssen','Mandeln','Pistazien','Walnüssen'],1)],
specials:[
tx('Welchen Film stellen diese Emojis dar? (Artikel darf fehlen)',['Der Nussknacker','Nussknacker'],'steps',{steps:['🌰','🔨']}),
tx('Welchen Film stellen diese Emojis dar? (Artikel darf fehlen)',['Schöne Bescherung'],'steps',{steps:['🏝️','🎄']}),
tx('Welchen Film stellen diese Emojis dar? (Artikel darf fehlen)',['Der Polarexpress','Polarexpress'],'steps',{steps:['🐻‍❄️','🚂']}),
tx('Welchen Film stellen diese Emojis dar? (Artikel darf fehlen)',['Der Grinch','Grinch'],'steps',{steps:['💚','😈','🎄']})]},
{name:'Rekorde',icon:'🏆',intro:'Höher, weiter, weihnachtlicher.',questions:[
mc('Wie lang war der längste Weihnachtsstollen der Welt, der 2025 in den Niederlanden gebacken wurde?',['35 Meter','52 Meter','65 Meter','Knapp 80 Meter'],3),
es('Wie viele Weihnachtsmänner versammelten sich 2014 zum Weltrekord in Indien?',18112,''),
mc('Wie groß war der höchste Schneemann der Welt, der 2008 in den USA gebaut wurde?',['12,50 Meter','22,15 Meter','37,21 Meter','48,60 Meter'],2),
es('Wie hoch war der höchste jemals aufgestellte, geschlagene Weihnachtsbaum?',64.6,'Meter'),
mc('Wie lange sang eine Frau aus Nigeria am Stück Weihnachtslieder, um einen Weltrekord aufzustellen?',['18 Stunden','24 Stunden','40 Stunden','52 Stunden'],2)],
specials:[tx('Lieder-Spezialfrage: Welches Lied wird hier (schlecht) gesungen?',[],'audio'),tx('Lieder-Spezialfrage: Beende den Satz! (Instrumental läuft im Hintergrund)',[],'audio')]},
{name:'Regionales',icon:'🏛️',intro:'Weihnachten in Koblenz und im Amt.',questions:[
es('Wie viele Weihnachtsmarktstände gibt es ungefähr auf dem Koblenzer Weihnachtsmarkt?',130,'Stände'),
mc('In welcher Stadt findet der größte Weihnachtsmarkt in Rheinland-Pfalz statt?',['Koblenz','Trier','Mainz','Ludwigshafen'],2),
mc('Wie konnte die Polizei 2017 in Koblenz-Horchheim einen Weihnachtsbaumdieb überführen?',['Der Dieb wurde von einer Gruppe Kinder verfolgt, da er ein Weihnachtsmannkostüm trug','Der Dieb wurde von einer Überwachungskamera gefilmt.','Der künstliche Schnee am Weihnachtsbaum hinterließ eine Spur bis zu seiner Wohnung.','Der Dieb verlor unterwegs seine Autoschlüssel.'],2),
mc('Die Stadtverwaltung möchte einen 4 Meter hohen Weihnachtsbaum im Eingangsbereich aufstellen. Welcher Aspekt ist dabei besonders wichtig?',['Die Anzahl der Christbaumkugeln.','Die Farbe der Weihnachtsbeleuchtung.','Die Freihaltung von Flucht- und Rettungswegen.','Die Zustimmung des Weihnachtsmannes.'],2),
mc('Der Weihnachtsmann möchte auf einem bislang unbebauten Grundstück eine riesige Weihnachtshalle errichten. Welcher Plan legt grundsätzlich fest, welche Art der baulichen Nutzung dort zulässig ist?',['Der Rettungswegeplan','Der Bebauungsplan','Der Winterdienstplan','Der Lageplan des Weihnachtsmannes'],1)],
specials:[tx('Lieder-/Film-Spezialfrage: Welches Lied oder welcher Film wird hier auf Chinesisch/Indisch gesungen?',[],'audio'),tx('Lieder-/Film-Spezialfrage: Welches Lied oder welcher Film wird hier auf Chinesisch/Indisch gesungen?',[],'audio')]}
]}}

var KEY='amt61-quiz-v1',D,sel={c:0,s:'questions',i:0},blobs=new WeakMap();
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||!D.categories)D=std();
var sb=null,pt;try{sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})}catch(e){}
function st(t){var e=document.getElementById('sbs');if(e)e.textContent=t}
function push(){if(!sb)return;st('Speichere …');sb.from('quiz').upsert({id:1,data:D}).then(function(r){st(r.error?'⚠ Supabase: '+r.error.message:'☁ In Supabase gespeichert')})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}if(sb){clearTimeout(pt);pt=setTimeout(push,1200)}}
function cur(){return D.categories[sel.c][sel.s][sel.i]}
function trk(q){if(!q.tracks){q.tracks=[];if(q.audio)q.tracks.push({src:q.audio,s:q.a1s,e:q.a1e,v:q.a1v});if(q.audio2)q.tracks.push({src:q.audio2,s:q.a2s,e:q.a2e,v:q.a2v,d:q.a2d})}if(!q.tracks.length)q.tracks.push({});return q.tracks}
function cors(q){return (Array.isArray(q.correct)?q.correct:[q.correct]).filter(function(i){return i!=null&&i>=0&&i<q.options.length})}
function medok(q){var r=q.reveal,sd=snd(q);if(IMGREV.indexOf(r)>=0&&!q.image)return false;if(r==='steps'&&!(q.steps&&q.steps.length))return false;
 if(sd==='audio'&&!trk(q).some(function(t){return t.src}))return false;if((sd==='synth'||sd==='rhythm')&&!q.notes)return false;return true}
function done(q){if(q.type==='mc')return q.options.length>=2&&q.options.every(Boolean)&&cors(q).length>0&&q.text&&medok(q);if(q.type==='estimate')return q.answer!==''&&q.text&&medok(q);
 var okA=q.nslots>1?(function(){for(var i=0;i<q.nslots;i++)if(!(q.slots&&q.slots[i]&&q.slots[i].length))return false;return true})():(q.answers&&q.answers.length>0);
 return !!q.text&&okA&&medok(q)}
var TYPE={mc:'Multiple Choice',estimate:'Schätzfrage',text:'Texteingabe'};
var REV={none:'Nur Text',image:'Bild zeigen (hübsch eingeblendet)',steps:'Schrittweise einblenden (Emojis, Übersetzungen …)',pixelate:'Bild verpixelt → scharf',zoom:'Bild zoomt heraus'};
var SND={none:'Kein Ton',audio:'🎵 Audiodatei (Lied, Geräusch … – auch mehrere Spuren)',synth:'🎹 Lied „schlecht“ mit Browsertönen',rhythm:'🥁 Nur Rhythmus (Klopfen)'},AUD=['audio','synth','rhythm'];
function snd(q){return q.sound||(AUD.indexOf(q.reveal)>=0?q.reveal:'none')}
function normRev(q){if(AUD.indexOf(q.reveal)>=0){if(!q.sound||q.sound==='none')q.sound=q.reveal;q.reveal='none'}}
var $=function(i){return document.getElementById(i)};
var IMGREV=['image','pixelate','zoom'],FXIN={soft:'✨ Sanft aus der Unschärfe',polaroid:'📸 Polaroid fällt herein',wipe:'🎞️ Von oben aufdecken',kenburns:'🔍 Einblenden + langsamer Zoom'};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

function tree(){
 var h='';
 D.categories.forEach(function(c,ci){
  h+='<div class="cat"><h3>'+c.icon+' '+esc(c.name)+'</h3>';
  c.questions.forEach(function(q,i){h+=row(ci,'questions',i,q)});
  h+='<div style="display:flex;gap:6px;margin:4px 0"><button class="s" data-add="'+ci+':questions">+ Frage</button></div>';
  c.specials.forEach(function(q,i){h+=row(ci,'specials',i,q)});
  h+='<button class="s" data-add="'+ci+':specials">+ Spezialfrage</button></div>';
 });
 $('tree').innerHTML=h;
}
function row(ci,s,i,q){
 var on=sel.c===ci&&sel.s===s&&sel.i===i;
 return '<div class="it'+(on?' on':'')+'" data-sel="'+ci+':'+s+':'+i+'"><span class="'+(done(q)?'':'todo')+'">●</span><span class="t">'+(i+1)+'. '+esc(q.text||'(leer)')+'</span><button class="s" data-mv="'+ci+':'+s+':'+i+':-1">↑</button><button class="s" data-mv="'+ci+':'+s+':'+i+':1">↓</button><button class="s" data-del="'+ci+':'+s+':'+i+'">✕</button></div>';
}

function field(l,h){return '<label>'+l+'</label>'+h}
function editor(){
 normRev(cur());
 if(anim){cancelAnimationFrame(anim);anim=0}
 var q=cur(),c=D.categories[sel.c],h='';
 h+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>'+esc(c.name)+'</b><span class="tag">'+(sel.s==='specials'?'Spezialfrage':'Frage '+(sel.i+1)+' von '+c.questions.length)+'</span></div>';
 h+=field('Kategorie-Name &amp; Intro (gilt für die ganze Kategorie)','<div class="g"><input data-cat="name" value="'+esc(c.name)+'"><input data-cat="intro" value="'+esc(c.intro)+'"></div>');
 h+=field('Zeit für die ganze Kategorie (Sekunden)','<div style="display:flex;gap:8px"><input type="number" id="ctm" value="'+(q.timeLimit||20)+'" style="max-width:120px"><button id="cap">Auf alle Fragen dieser Kategorie anwenden</button></div>');
 h+=field('Fragetyp','<select data-k="type">'+Object.keys(TYPE).map(function(k){return '<option value="'+k+'"'+(q.type===k?' selected':'')+'>'+TYPE[k]+'</option>'}).join('')+'</select>');
 h+=field('Fragetext','<textarea data-k="text" style="font-family:inherit;font-size:16px">'+esc(q.text)+'</textarea>');
 if(q.type==='mc'){
  var C=cors(q);
  h+='<label>Antworten (Haken = richtig, auch mehrere möglich · 2 bis 6 Antworten)</label>';
  q.options.forEach(function(o,i){h+='<div class="opt"><input type="checkbox" data-cor="'+i+'"'+(C.indexOf(i)>=0?' checked':'')+' title="richtige Antwort"><b>'+'ABCDEF'[i]+'</b><input data-opt="'+i+'" value="'+esc(o)+'">'+(q.options.length>2?'<button class="s" data-rmopt="'+i+'" title="Antwort entfernen">✕</button>':'')+'</div>'});
  if(q.options.length<6)h+='<button class="s" id="addopt" style="margin-top:6px">+ Antwort</button>';
  h+='<div class="note">'+(C.length>1?'Am Handy müssen genau '+C.length+' Antworten gewählt werden.':'Eine richtige Antwort – Antippen sendet sofort.')+'</div>';
  h+=field('Punkte pro richtiger Antwort (leer = Tempo-Wertung: Schnellste/r 1000 … 100)','<input type="number" min="0" data-k="ppc" placeholder="Tempo-Wertung" value="'+(q.ppc==null||q.ppc===''?'':esc(q.ppc))+'" style="max-width:160px">');
  h+=medUI(q);
 }else if(q.type==='estimate'){
  h+=field('Gesuchte Zahl &amp; Einheit','<div class="g"><input type="number" step="any" data-k="answer" value="'+esc(q.answer)+'"><input data-k="unit" placeholder="z. B. Meter" value="'+esc(q.unit||'')+'"></div>');
  h+=medUI(q);
 }else{
  h+=field('Anzahl Antwortfelder am Handy (z. B. 3 für „Welche 3 Lieder hörst du?“)','<input type="number" min="1" max="6" data-k="nslots" value="'+(q.nslots||1)+'" style="max-width:120px">');
  if(q.nslots>1){for(var si=0;si<q.nslots;si++)h+=field('Antwortfeld '+(si+1)+': erlaubte Schreibweisen (eine pro Zeile; Reihenfolge der Eingaben egal)','<textarea data-slot="'+si+'">'+esc(((q.slots||[])[si]||[]).join('\n'))+'</textarea>')}
  else h+=field('Erlaubte Antworten (eine pro Zeile; Artikel &amp; kleine Tippfehler werden verziehen)','<textarea data-list="answers">'+esc((q.answers||[]).join('\n'))+'</textarea>');
  h+=medUI(q);
  h+=field('Falsche Tipps nach der Auflösung anonym am Beamer zeigen','<select data-k="showWrong"><option value="">Ja (ohne Namen)</option><option value="no"'+(q.showWrong==='no'?' selected':'')+'>Nein</option></select>');
  h+=field('Antwort testen (Fuzzy-Match)','<input id="tst" placeholder="Tippfehler ausprobieren …"><div id="res"></div>');
 }
 h+=field('💡 Funfact bei der Auflösung (optional – erscheint auf Beamer &amp; Handys)','<textarea data-k="fact" placeholder="z. B. Der höchste Weihnachtsbaum der Welt war 67 m hoch." style="font-family:inherit;font-size:15px;min-height:60px">'+esc(q.fact||'')+'</textarea>');
 h+=field('Zeit nur für diese Frage (Sekunden)','<input type="number" data-k="timeLimit" value="'+(q.timeLimit||20)+'" style="max-width:120px">');
 $('ed').innerHTML=h;
 if(q.reveal==='steps')stp();
 if(IMGREV.indexOf(q.reveal)>=0)picInit();
 if(snd(q)==='audio')trk(q).forEach(function(t,i){if(!t.src)return;var x=new Audio(t.src);x.onloadedmetadata=function(){var e=document.getElementById('d'+i);if(e)e.textContent='(Länge: '+x.duration.toFixed(1)+' s)'}});
}
function stp(){var e=$('stp');if(e)e.innerHTML=(cur().steps||[]).map(function(s){return '<span>'+esc(s)+'</span>'}).join('')}

/* Bild-Darstellungen: Editor-UI, Vorschau, Fokus wählen */
function rng(k,l,min,max,step,val,fmt){return field(l,'<div class="rng"><input type="range" data-k="'+k+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"><b id="lv_'+k+'">'+fmt(val)+'</b></div>')}
var FMT={px:function(v){return v+' Blöcke'},endp:function(v){return v+' %'},zoom:function(v){return v+'×'}};
function medUI(q){var sd=snd(q),h='<div style="border-top:2px solid #345a49;margin-top:14px;padding-top:2px"></div>'+revUI(q);
  if(q.reveal==='steps')h+=field('Schritte (eine pro Zeile, werden nacheinander eingeblendet)','<textarea data-list="steps">'+esc((q.steps||[]).join('\n'))+'</textarea><div class="steps" id="stp"></div>');
  h+=sndSel(q);
  if(sd==='audio'){
   const T=trk(q),num=(i,k,l,ph)=>'<div><label>'+l+'</label><input type="number" step="any" min="0" data-tr="'+i+'" data-f="'+k+'" placeholder="'+ph+'" value="'+(T[i][k]==null||T[i][k]===''?'':esc(T[i][k]))+'"></div>';
   T.forEach(function(t,i){
    h+='<div style="border:2px solid #345a49;border-radius:10px;padding:10px;margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center"><b>🎵 Spur '+(i+1)+(i?' (wird darübergelegt)':' (Basis)')+'</b>'+(T.length>1?'<button class="s" data-rmtr="'+i+'">✕ entfernen</button>':'')+'</div>'
     +'<label>Datei hochladen</label><input type="file" accept="audio/*" data-ftr="'+i+'">'+msel('str'+i,t.src,'aud').replace('<select ','<select data-str="'+i+'" ')+'<div class="note">Aktuell: '+esc(fname(t.src))+' <b id="d'+i+'"></b></div>'
     +'<div class="g" style="grid-template-columns:repeat(4,1fr)">'+num(i,'s','Start (Sek.)','0')+num(i,'e','Ende (Sek.)','bis Schluss')+num(i,'v','Lautstärke %','100')+num(i,'d','Einsatz nach (Sek.)','0')+'</div></div>'});
   h+='<div style="margin-top:8px"><button id="addtr">+ weitere Spur übereinanderlegen</button></div>';
   h+='<div style="margin-top:8px"><button class="p" id="mx">▶ Mix anhören</button> <button id="mxs">■ Stopp</button></div><div class="note">Zuschneiden: Start/Ende der Spur in Sekunden (die hochgeladene Datei bleibt unverändert, der Zuschnitt gilt nur beim Abspielen). „Einsatz nach“ verzögert eine Spur gegenüber dem Start.</div>';
  }
  if(sd==='synth'||sd==='rhythm'){
   h+=field('Noten (Format F#5:.5 E5:1 R:.5 – R = Pause, Länge in Vierteln)','<textarea data-k="notes">'+esc(q.notes||'')+'</textarea>');

  }

function sndSel(q){return field('🔊 Ton / Musik während der Frage (läuft parallel zur Darstellung)','<select data-k="sound">'+Object.keys(SND).map(function(k){return '<option value="'+k+'"'+(snd(q)===k?' selected':'')+'>'+SND[k]+'</option>'}).join('')+'</select>')}
function revUI(q){
 var R=Object.keys(REV),r=R.indexOf(q.reveal||'none')<0?'none':(q.reveal||'none'),h='';

 if(IMGREV.indexOf(r)<0)return h;

  h+='<label>Vorschau (so erscheint es auf dem Beamer)</label><div class="stage" id="pv"></div><div class="pvbar"><button class="p" id="pvp">▶ Effekt nochmal ansehen</button></div>';
  return h}
 if(r==='zoom'){

  h+=rng('zoom','Start-Zoom (wie stark am Anfang herangezoomt)',2,20,1,q.zoom||8,FMT.zoom);
 }else h+=rng('px','Start-Grobheit (Anzahl Blöcke quer – weniger = schwerer)',3,60,1,q.px||3,FMT.px);

 h+='<label>Vorschau – Ablauf über die Fragezeit</label><div class="stage"><canvas id="cv" width="640" height="360"></canvas></div><div class="pvbar"><button class="p" id="pvp">▶ Abspielen</button><input type="range" id="pg" min="0" max="1000" value="0"><b id="pgt" style="min-width:60px;text-align:right">0 s</b></div>';

}
var IMC={};
function getIm(src,cb){if(!src)return;var e=IMC[src];if(e&&e.complete&&e.naturalWidth)return cb(e);if(!e){e=IMC[src]=new Image();e.src=src}e.addEventListener('load',function(){cb(e)},{once:true})}
function fitIn(bw,bh,a){var w=bw,h=w/a;if(h>bh){h=bh;w=h*a}return{w:Math.round(w),h:Math.round(h)}}
function sizeCv(cv,im){var f=fitIn(640,360,im.naturalWidth/im.naturalHeight);if(cv.width!==f.w||cv.height!==f.h){cv.width=f.w;cv.height=f.h}return f}
/* gleiche Formel wie auf dem Beamer */
function drawRev(x,im,q,p,W,H){
 var e=Math.min(1,p*100/(q.endp||100));
 if(q.reveal==='pixelate'){
  if(e>=1){x.imageSmoothingEnabled=true;x.drawImage(im,0,0,W,H);return}
  var n0=q.px||3,n=Math.max(n0,Math.round(n0+(300-n0)*e*e*e)),h=Math.max(1,Math.round(n*H/W)),o=document.createElement('canvas');o.width=n;o.height=h;o.getContext('2d').drawImage(im,0,0,n,h);x.imageSmoothingEnabled=false;x.drawImage(o,0,0,W,H);
 }else{
  var iw=im.naturalWidth,ih=im.naturalHeight,s=Math.pow(q.zoom||8,1-e),w=iw/s,hh=ih/s,c=crop(q,iw,ih,w,hh);x.imageSmoothingEnabled=true;x.drawImage(im,c.x,c.y,w,hh,0,0,W,H);
 }
}
function crop(q,iw,ih,w,h){var fx=(q.fx==null?50:q.fx)/100*iw,fy=(q.fy==null?50:q.fy)/100*ih;return{x:Math.min(Math.max(fx-w/2,0),iw-w),y:Math.min(Math.max(fy-h/2,0),ih-h)}}
function prev(){
 var q=cur(),cv=$('cv');if(!cv)return;
 if(!q.image){var x=cv.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#a9c2b4';x.font='20px sans-serif';x.fillText('Noch kein Bild gewählt',cv.width/2-100,cv.height/2);return}
 getIm(q.image,function(im){var c=$('cv');if(!c)return;var f=sizeCv(c,im),p=($('pg')?+$('pg').value:0)/1000;drawRev(c.getContext('2d'),im,q,p,f.w,f.h);
  var t=$('pgt');if(t)t.textContent=(p*(q.timeLimit||20)).toFixed(1)+' s'});
 focDraw();
}
function focDraw(){
 var q=cur(),cv=$('foc');if(!cv||!q.image)return;
 getIm(q.image,function(im){var c=$('foc');if(!c)return;var f=sizeCv(c,im),x=c.getContext('2d'),z=q.zoom||8,w=f.w/z,h=f.h/z,cr=crop(q,f.w,f.h,w,h);
  x.drawImage(im,0,0,f.w,f.h);x.fillStyle='rgba(0,0,0,.55)';x.beginPath();x.rect(0,0,f.w,f.h);x.rect(cr.x+w,cr.y,-w,h);x.fill();
  x.strokeStyle='#f5c542';x.lineWidth=2;x.strokeRect(cr.x,cr.y,w,h);
  var px=(q.fx==null?50:q.fx)/100*f.w,py=(q.fy==null?50:q.fy)/100*f.h;x.beginPath();x.moveTo(px-9,py);x.lineTo(px+9,py);x.moveTo(px,py-9);x.lineTo(px,py+9);x.stroke()});
}
var anim=0;
function pvStop(){cancelAnimationFrame(anim);anim=0;var b=$('pvp');if(b&&cur().reveal!=='image')b.textContent='▶ Abspielen'}
function pvPlay(){
 var q=cur();if(q.reveal==='image'){showPic();return}
 if(anim){pvStop();return}
 var secs=q.timeLimit||20,t0=Date.now()-(+$('pg').value/1000)*secs*1000;if(+$('pg').value>=1000)t0=Date.now();$('pvp').textContent='⏸ Pause';
 var loop=function(){var g=$('pg');if(!g){anim=0;return}var p=Math.min(1,(Date.now()-t0)/secs/1000);g.value=Math.round(p*1000);prev();if(p<1)anim=requestAnimationFrame(loop);else pvStop()};loop();
}
function showPic(){
 var q=cur(),b=$('pv');if(!b)return;
 if(!q.image){b.innerHTML='<span class="note">Noch kein Bild gewählt</span>';return}
 getIm(q.image,function(im){var B=$('pv');if(!B)return;var fx=q.fxIn||'soft',f=fitIn(B.clientWidth*.9,B.clientHeight*.9,im.naturalWidth/im.naturalHeight);
  B.innerHTML='<div class="pw" style="width:'+f.w+'px;height:'+f.h+'px"><img alt=""></div>';var w=B.firstChild;w.firstChild.src=q.image;w.firstChild.style.animationDuration='8s';
  void w.offsetWidth;w.className='pw pin-'+fx});
}
function picInit(){
 var q=cur();pvStop();
 if(q.reveal==='image')showPic();else prev();
 var cv=$('foc');
 if(cv){var down=false,setF=function(e){var r=cv.getBoundingClientRect();q.fx=Math.round(Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100)));q.fy=Math.round(Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100)));focDraw();if(!anim)prev()};
  cv.onpointerdown=function(e){down=true;cv.setPointerCapture(e.pointerId);setF(e)};cv.onpointermove=function(e){if(down)setF(e)};cv.onpointerup=function(){down=false;save()}}
 var d=$('drop');
 if(d){d.ondragover=function(e){e.preventDefault();d.classList.add('on')};d.ondragleave=function(){d.classList.remove('on')};
  d.ondrop=function(e){e.preventDefault();d.classList.remove('on');var f=[].slice.call(e.dataTransfer.files||[]).filter(function(f){return /^image\//.test(f.type)})[0];if(f)setImg(f)}}
}
function setImg(f){var q=cur();st('Lade '+f.name+' hoch …');var d=$('drop');if(d)d.style.opacity=.5;upl(f,function(u){q.image=u;save();tree();editor()})}
document.addEventListener('paste',function(e){var q;try{q=cur()}catch(x){return}if(!q||IMGREV.indexOf(q.reveal)<0||!$('drop'))return;
 var it=[].slice.call((e.clipboardData&&e.clipboardData.items)||[]).filter(function(i){return i.kind==='file'&&/^image\//.test(i.type)})[0];if(!it)return;
 e.preventDefault();var f=it.getAsFile(),ext=(f.type.split('/')[1]||'png').replace('jpeg','jpg');setImg(new File([f],'eingefuegt.'+ext,{type:f.type}))});

/* Fuzzy */
function norm(s){return String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().replace(/^(der|die|das|ein|eine|the) /,'')}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=1;j<=b.length;j++)m[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function match(inp,answers){var a=norm(inp);return answers.some(function(r){var b=norm(r);return b&&lev(a,b)<=Math.floor(b.length/5)})}

/* Medien: Upload in Supabase Storage (Bucket quiz-media) + Auswahl vorhandener Dateien */
var BUCKET='quiz-media',media=[];
function loadMedia(cb){if(!sb||!sb.storage){if(cb)cb();return}sb.storage.from(BUCKET).list('',{limit:500,sortBy:{column:'created_at',order:'desc'}}).then(function(r){if(r.error)st('⚠ Medien: '+r.error.message);media=(r.data||[]).filter(function(f){return f.name&&f.name.charAt(0)!=='.'});if(cb)cb()})}
function murl(n){return sb.storage.from(BUCKET).getPublicUrl(n).data.publicUrl}
function fname(u){return u?decodeURIComponent(String(u).split('/').pop()).replace(/^\d+-/,''):'–'}
function msel(id,cur,kind){var ex=kind==='img'?/\.(png|jpe?g|webp|gif|avif)$/i:/\.(mp3|ogg|wav|m4a|aac|flac)$/i;
 return '<select id="'+id+'"><option value="">– vorhandene Datei wählen ('+media.filter(function(f){return ex.test(f.name)}).length+') –</option>'+media.filter(function(f){return ex.test(f.name)}).map(function(f){var u=murl(f.name);return '<option value="'+esc(u)+'"'+(u===cur?' selected':'')+'>'+esc(fname(f.name))+'</option>'}).join('')+'</select>'}
function upl(f,cb){if(!sb||!sb.storage){alert('Supabase ist nicht verbunden.');return}
 st('Lade '+f.name+' hoch …');var n=Date.now()+'-'+f.name.replace(/[^\w.\-]+/g,'_');
 sb.storage.from(BUCKET).upload(n,f,{upsert:true,contentType:f.type||undefined}).then(function(r){if(r.error){st('⚠ Upload: '+r.error.message);return}st('☁ Hochgeladen: '+f.name);loadMedia(function(){cb(murl(n))})})}
/* Mix-Vorschau für Audiofragen (zwei Dateien übereinander, Zuschnitt, Lautstärke, Versatz) */
var mixA=[],mixT=[];
function mixStop(){mixA.forEach(function(x){x.pause()});mixA=[];mixT.forEach(clearTimeout);mixT=[]}
function mixPlay(q){mixStop();trk(q).forEach(function(t){if(!t.src)return;
 var x=new Audio(t.src),nm=function(k,d){var v=t[k];return v===''||v==null||isNaN(+v)?d:+v},s=nm('s',0),e=nm('e',null),dl=nm('d',0);
 x.volume=Math.max(0,Math.min(1,nm('v',100)/100));x.addEventListener('loadedmetadata',function(){x.currentTime=s});mixA.push(x);
 mixT.push(setTimeout(function(){x.play().catch(function(){});if(e!=null)mixT.push(setTimeout(function(){x.pause()},Math.max(0,e-s)*1000))},dl*1000))})}
/* Audio-Engine */
var AC,live=[];
function stop(){live.forEach(function(n){try{n.stop()}catch(e){}});live=[]}
function parse(t){var N={C:0,D:2,E:4,F:5,G:7,A:9,B:11};return(t||'').trim().split(/\s+/).map(function(s){var p=s.split(':'),l=parseFloat(p[1])||1;if(p[0].toUpperCase()==='R')return{r:1,l:l};var m=/^([A-Ga-g])([#b]?)(\d)$/.exec(p[0]);if(!m)return null;var v=12*(+m[3]+1)+N[m[1].toUpperCase()]+(m[2]==='#'?1:m[2]==='b'?-1:0);return{f:440*Math.pow(2,(v-69)/12),l:l}}).filter(Boolean)}
function play(q){
 stop();AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();
 var b=60/(q.bpm||112),t=AC.currentTime+.1,v=q.voice||'ring';
 parse(q.notes).forEach(function(n){var d=n.l*b;
  if(!n.r){var o=AC.createOscillator(),g=AC.createGain();
   if(snd(q)==='rhythm'){o.type='triangle';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(600,t+.05);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.12)}
   else{var f=n.f;o.type=v==='ring'?'square':'sawtooth';if(v==='bit')o.type='square';if(v==='sour')f*=Math.pow(2,(Math.random()*70-35)/1200*1.4);if(v==='kazoo')f/=2;
    o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.01);g.gain.setValueAtTime(.16,t+d*.8);g.gain.linearRampToValueAtTime(0,t+d*.98)}
   o.connect(g).connect(AC.destination);o.start(t);o.stop(t+Math.max(d,.15));live.push(o)}
  t+=d});
}

/* Events */
$('tree').addEventListener('click',function(e){
 var t=e.target,a;
 if(a=t.dataset.add){a=a.split(':');var c=D.categories[+a[0]],q=a[1]==='questions'?mc('',['','','',''],0):tx('',[],'none');c[a[1]].push(q);sel={c:+a[0],s:a[1],i:c[a[1]].length-1}}
 else if(a=t.dataset.del){a=a.split(':');if(!confirm('Frage wirklich löschen?'))return;var l=D.categories[+a[0]][a[1]];l.splice(+a[2],1);sel={c:+a[0],s:a[1],i:Math.max(0,Math.min(+a[2],l.length-1))};if(!l.length){l.push(mc('',['','','',''],0));sel.i=0}}
 else if(a=t.dataset.mv){a=a.split(':');var l2=D.categories[+a[0]][a[1]],i=+a[2],j=i+ +a[3];if(j<0||j>=l2.length)return;var x=l2[i];l2[i]=l2[j];l2[j]=x;sel={c:+a[0],s:a[1],i:j}}
 else{var r=t.closest('[data-sel]');if(!r)return;a=r.dataset.sel.split(':');sel={c:+a[0],s:a[1],i:+a[2]}}
 save();tree();editor();
});
$('ed').addEventListener('input',function(e){
 var t=e.target,q=cur(),c=D.categories[sel.c];
 if(t.dataset.cat){c[t.dataset.cat]=t.value;tree();}
 else if(t.dataset.k){var k=t.dataset.k;
  if(k==='type'){
   if(t.value==='mc'){q.options=q.options||['','','',''];if(q.correct==null)q.correct=0}
   if(t.value==='estimate'&&q.answer==null)q.answer='';
   q.type=t.value;save();tree();editor();return}
  if(k==='ppc'){q.ppc=t.value===''?'':Math.max(0,parseFloat(t.value)||0);save();return}
  if(k==='reveal'){q.reveal=t.value;pvStop();save();tree();editor();return}
  if(k==='sound'){q.sound=t.value;if(typeof mixStop==='function')mixStop();stop();save();tree();editor();return}
  if(k==='fxIn'){q.fxIn=t.value;save();showPic();return}
  if(k==='nslots'){var n=Math.max(1,Math.min(6,parseInt(t.value)||1));q.nslots=n;q.slots=(q.slots||[]).slice(0,n);while(q.slots.length<n)q.slots.push([]);save();tree();editor();return}
  q[k]=(t.type==='number'||t.type==='range')&&t.value!==''?parseFloat(t.value):t.value;
  if(FMT[k]&&$('lv_'+k))$('lv_'+k).textContent=FMT[k](q[k]);
  if(k==='zoom')focDraw();
  if(k==='text'||k==='answer')tree();
  if(k==='px'||k==='endp'||k==='zoom'||k==='timeLimit')prev()}
 else if(t.dataset.tr!=null){trk(q)[+t.dataset.tr][t.dataset.f]=t.value===''?'':parseFloat(t.value)}
 else if(t.dataset.slot!=null){q.slots=q.slots||[];q.slots[+t.dataset.slot]=t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);tree()}
 else if(t.dataset.opt!=null){q.options[+t.dataset.opt]=t.value;tree()}
 else if(t.dataset.cor!=null){var C=cors(q),ci=+t.dataset.cor;if(t.checked){if(C.indexOf(ci)<0)C.push(ci)}else C=C.filter(function(x){return x!==ci});
  if(!C.length){t.checked=true;C=[ci]}C.sort();q.correct=C.length===1?C[0]:C;save();tree();editor();return}
 else if(t.dataset.list){q[t.dataset.list]=t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);if(t.dataset.list==='steps')stp();tree()}
 else if(t.id==='tst'){var ok=q.type==='estimate'?null:match(t.value,q.nslots>1?[].concat.apply([],q.slots||[]):(q.answers||[]));$('res').textContent=!t.value?'':ok?'✅ Richtig (Tippfehler verziehen)':'❌ Falsch';}
 else if(t.id==='pg'){pvStop();prev()}
 save();
});
$('ed').addEventListener('change',function(e){
 var t=e.target,q=cur(),f=t.files&&t.files[0];
 if(f&&t.dataset.ftr!=null){var ti=+t.dataset.ftr;upl(f,function(u){trk(q)[ti].src=u;save();tree();editor()})}

$('ed').addEventListener('click',function(e){var q=cur();
